<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>抖音续火花</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<div class="wrapper">

  <!-- Header -->
  <header>
    <div class="logo">
      <span class="logo-icon">🔥</span>
      <span>抖音续火花</span>
    </div>
    <div class="badge idle" id="run-badge">空闲</div>
  </header>

  <!-- Status strip -->
  <div class="status-strip">
    <div class="strip-item">
      <span class="strip-label">登录</span>
      <span class="strip-value off" id="stat-login">检测中…</span>
    </div>
    <div class="strip-sep"></div>
    <div class="strip-item">
      <span class="strip-label">定时</span>
      <span class="strip-value off" id="stat-sched">未启动</span>
    </div>
    <div class="strip-sep"></div>
    <div class="strip-item">
      <span class="strip-label">上次运行</span>
      <span class="strip-value off" id="stat-last">—</span>
    </div>
    <div class="strip-sep"></div>
    <div class="strip-item">
      <span class="strip-label">下次运行</span>
      <span class="strip-value off" id="stat-next">—</span>
    </div>
  </div>

  <!-- Action bar -->
  <div class="action-bar">
    <div class="action-left">
      <button class="btn-primary" id="btn-run" onclick="runNow()">▶&nbsp;立即执行</button>
      <button class="btn-outline" id="btn-login" onclick="doLogin()">🔑&nbsp;登录</button>
      <button class="btn-outline" id="btn-clear-cookie" onclick="clearCookies()">清除登录</button>
      <button class="btn-danger"  id="btn-reset" onclick="resetState()" title="任务卡死时强制恢复">强制重置</button>
    </div>
    <div class="action-sep"></div>
    <div class="action-right">
      <span class="sched-label">每天</span>
      <input type="time" id="sched-time" value="08:00" />
      <button class="btn-green"   id="btn-sched-start" onclick="startSchedule()">⏰&nbsp;启动定时</button>
      <button class="btn-outline" id="btn-sched-apply" onclick="applyScheduleTime()">更新时间</button>
      <button class="btn-outline" id="btn-sched-stop"  onclick="stopSchedule()" disabled>停止</button>
    </div>
  </div>

  <!-- Config card: two-column layout -->
  <div class="card config-card">
    <div class="config-cols">
      <div class="config-col">
        <div class="col-title">好友列表</div>
        <div class="field-row">
          <input type="text" id="friend-input" placeholder="输入好友昵称（完全匹配）"
                 onkeydown="if(event.key==='Enter')addFriend()" />
          <button class="btn-outline" onclick="addFriend()">添加</button>
        </div>
        <div class="tags" id="friends-tags"></div>
      </div>
      <div class="col-divider"></div>
      <div class="config-col">
        <div class="col-title">消息模板 <span class="col-hint">随机选一条</span></div>
        <div class="field-row">
          <input type="text" id="msg-input" placeholder="输入消息内容"
                 onkeydown="if(event.key==='Enter')addMessage()" />
          <button class="btn-outline" onclick="addMessage()">添加</button>
        </div>
        <div class="tags" id="messages-tags"></div>
      </div>
    </div>
    <div class="config-footer">
      <label class="ios-switch">
        <input type="checkbox" id="headless" />
        <span class="ios-track"></span>
      </label>
      <div class="footer-text">
        <span class="toggle-label">无头模式</span>
        <span class="toggle-sub">后台静默运行</span>
      </div>
      <button class="btn-primary" onclick="saveConfig()">保存配置</button>
    </div>
  </div>

  <!-- Logs: macOS Console style -->
  <div class="console-panel">
    <div class="console-toolbar">
      <span class="console-title">实时日志</span>
      <button class="console-clear" onclick="clearLogs()">清空</button>
    </div>
    <div id="log-box"></div>
  </div>

</div>

<div id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
