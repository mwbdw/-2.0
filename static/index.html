<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>抖音续火花 2.0</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<div class="wrapper">

  <!-- Header -->
  <header>
    <div class="logo">🔥 <span>抖音</span>续火花 2.0</div>
    <div class="badge idle" id="run-badge">空闲</div>
  </header>

  <!-- Status Card -->
  <div class="card">
    <div class="card-title">状态</div>
    <div class="status-grid">
      <div class="stat">
        <div class="stat-label">登录状态</div>
        <div class="stat-value off" id="stat-login">检测中…</div>
      </div>
      <div class="stat">
        <div class="stat-label">定时任务</div>
        <div class="stat-value off" id="stat-sched">未启动</div>
      </div>
      <div class="stat">
        <div class="stat-label">上次运行</div>
        <div class="stat-value off" id="stat-last">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">下次运行</div>
        <div class="stat-value off" id="stat-next">—</div>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="btn-run" onclick="runNow()">▶ 立即执行</button>
      <button class="btn-outline" id="btn-login" onclick="doLogin()">🔑 登录</button>
      <button class="btn-danger" id="btn-clear-cookie" onclick="clearCookies()">🗑 清除登录</button>
      <button class="btn-outline" id="btn-reset" onclick="resetState()" title="任务卡死时强制恢复">⚠️ 强制重置</button>
    </div>

    <div class="section-sub" style="margin-top:16px;">定时发送</div>
    <div class="field-row" style="align-items:center;gap:10px;flex-wrap:wrap;">
      <label style="color:var(--muted);font-size:13px;white-space:nowrap;">每天时间</label>
      <input type="time" id="sched-time" value="08:00" style="width:120px;" />
      <button class="btn-green" id="btn-sched-start" onclick="startSchedule()">⏰ 启动定时</button>
      <button class="btn-outline" id="btn-sched-apply" onclick="applyScheduleTime()">✏️ 更新时间</button>
      <button class="btn-outline" id="btn-sched-stop" onclick="stopSchedule()" disabled>⏹ 停止定时</button>
    </div>
  </div>

  <!-- Config Card -->
  <div class="card">
    <div class="card-title">配置</div>

    <div class="section-sub">好友列表</div>
    <div class="field-row">
      <input type="text" id="friend-input" placeholder="输入好友昵称（完全匹配）" onkeydown="if(event.key==='Enter')addFriend()" />
      <button class="btn-outline" onclick="addFriend()">添加</button>
    </div>
    <div class="tags" id="friends-tags"></div>

    <div class="section-sub">消息模板（随机选一条发送）</div>
    <div class="field-row">
      <input type="text" id="msg-input" placeholder="输入消息内容" onkeydown="if(event.key==='Enter')addMessage()" />
      <button class="btn-outline" onclick="addMessage()">添加</button>
    </div>
    <div class="tags" id="messages-tags"></div>

    <div class="section-sub">定时设置</div>
    <div class="field-row" style="align-items:center;gap:16px;">
      <label style="color:var(--muted);font-size:13px;">每天发送时间（同上方定时设置）</label>
      <input type="time" id="send-time" value="08:00"
             oninput="document.getElementById('sched-time').value=this.value" />
    </div>

    <div class="toggle-row">
      <input type="checkbox" id="headless" />
      <label for="headless" class="toggle-label">无头模式（隐藏浏览器窗口）</label>
    </div>

    <div class="btn-row" style="margin-top:20px;">
      <button class="btn-primary" onclick="saveConfig()">💾 保存配置</button>
    </div>
  </div>

  <!-- Logs Card -->
  <div class="card">
    <div class="log-header">
      <div class="card-title" style="margin:0;">实时日志</div>
      <button class="btn-outline" onclick="clearLogs()" style="padding:5px 12px;font-size:12px;">清空</button>
    </div>
    <div id="log-box"></div>
  </div>

</div>

<div id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
